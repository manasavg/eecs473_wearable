; Excursion wearable PCB. Copy this folder to variants/esp32s3/excursion_pcb in a
; meshtastic/firmware checkout, then: pio run -e excursion-pcb -t upload
[env:excursion-pcb]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = PRIVATE_HW
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Excursion PCB

extends = esp32s3_base
; ESP32-S3-WROOM-1-N8R8: 8 MB quad flash, 8 MB octal PSRAM. Octal PSRAM takes GPIO 35-37.
board = esp32-s3-devkitc-1
board_check = true
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
upload_protocol = esptool
build_flags =
  ${esp32s3_base.build_flags}
  -D EXCURSION_PCB
  -D BOARD_HAS_PSRAM
  -I variants/esp32s3/excursion_pcb
